# Always invoke with the explicit namespace generated by presidium-dev.
x-node: &node
  image: node:24.13.0-bookworm@sha256:1de022d8459f896fff2e7b865823699dc7a8d5567507e8b87b14a7442e07f206
  working_dir: /app
  init: true
  restart: 'no'
  labels:
    dev.presidium.project: ${DEV_PROJECT:?provided by presidium-dev}
    dev.presidium.environment: ${DEV_ENVIRONMENT:?provided by presidium-dev}
  mem_limit: 2g
  cpus: 2.0
  pids_limit: 256
  logging: &logging
    driver: json-file
    options:
      max-size: '10m'
      max-file: '3'
  environment: &environment
    PATH: /tools/bin:/tools/node_modules/.bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    CI: 'true'
    VITEST_MAX_WORKERS: '1'
    # Bind mounts retain the host dev UID; scope Git trust to these three known paths.
    GIT_CONFIG_COUNT: '3'
    GIT_CONFIG_KEY_0: safe.directory
    GIT_CONFIG_VALUE_0: /app
    GIT_CONFIG_KEY_1: safe.directory
    GIT_CONFIG_VALUE_1: /app/vendor/steel-compendium
    GIT_CONFIG_KEY_2: safe.directory
    GIT_CONFIG_VALUE_2: /app/vendor/forge-steel
    NODE_OPTIONS: --max-old-space-size=1536
    VITE_LOCAL_PROXY: 'true'
    VITE_SITE_URL: ${DEV_WEB_URL}
    VITE_CONVEX_URL: http://backend:3210
    VITE_CONVEX_SITE_URL: http://backend:3211
    DEV_WEB_URL: ${DEV_WEB_URL:?provided by presidium-dev}
  volumes: &volumes
    - ${DEV_SOURCE:?provided by presidium-dev}:/app
    - dependencies:/app/node_modules
    - tools:/tools
    - ${DEV_ARTIFACTS:?provided by presidium-dev}:/artifacts
    - ${DEV_SOURCE_METADATA:?provided by presidium-dev}:/runtime-source.json:ro

services:
  install:
    <<: *node
    profiles: [tasks]
    command: [bash, runtime/install.sh]

  backend:
    <<: *node
    mem_limit: 3g
    pids_limit: 512
    environment:
      <<: *environment
      CONVEX_AGENT_MODE: anonymous
      CONVEX_DISABLE_ANALYTICS: '1'
      DO_NOT_TRACK: '1'
    volumes:
      - ${DEV_SOURCE}:/app
      - dependencies:/app/node_modules
      - tools:/tools
      - backend-data:/app/.convex
      - backend-cache:/root/.cache/convex
      - ${DEV_CONFIG:?provided by presidium-dev}:/runtime-config:ro
      - ${DEV_ARTIFACTS}:/artifacts
    command: [node, runtime/backend.mjs]
    healthcheck:
      test: [CMD, node, -e, "require('fs').accessSync('/tmp/backend-ready')"]
      interval: 5s
      timeout: 3s
      retries: 60
    stop_grace_period: 30s

  web:
    <<: *node
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - target: 5180
        host_ip: 127.0.0.1
        protocol: tcp
    # install already generated the pinned rules; avoid repeating that work at web startup.
    command: [pnpm, exec, vite, --host, 0.0.0.0]

  build:
    <<: *node
    profiles: [tasks]
    command: [pnpm, build]

  browser:
    <<: *node
    image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    profiles: [tasks]
    mem_limit: 2g
    shm_size: 512m
    pids_limit: 512
    environment:
      <<: *environment
      SALIENT_TEST_URL: ${DEV_WEB_URL}
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    command:
      [pnpm, exec, playwright, test, --workers=1, --output=/artifacts/browser, --reporter=line]

volumes:
  dependencies:
  tools:
  backend-data:
  backend-cache:
