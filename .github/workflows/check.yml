name: check

# TESTER is the normal gate. Promotion pushes reuse that result.
# Dispatch only when TESTER deliberately chooses a GitHub runner.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Pinned submodules only; never --remote, so vendor/ stays at the committed commits.
          submodules: true
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          SKIP_INSTALL_SIMPLE_GIT_HOOKS: '1'
      - run: pnpm check
      - name: Check commit messages on this branch
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="origin/${{ github.base_ref }}..HEAD"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${{ github.event.before }}" 2>/dev/null; then
            range="${{ github.event.before }}..HEAD"
          else
            range="origin/main..HEAD"
          fi
          echo "Checking $range"
          node scripts/check-commit.ts --range "$range"
