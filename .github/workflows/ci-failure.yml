name: CI failure notification

on:
  workflow_run:
    workflows: [check, CI notification probe]
    types: [completed]

permissions:
  contents: read
  issues: write

concurrency:
  group: ci-failure-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  notify:
    if: ${{ contains(fromJSON('["failure","timed_out","startup_failure","action_required"]'), github.event.workflow_run.conclusion) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Trusted default-branch event SHA; never check out the failed branch or its artifacts.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const notify = require('./.github/scripts/notify-ci-failure.cjs');
            await notify({ github, context, core });
