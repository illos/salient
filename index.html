<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f3f0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)" />
    <title>Salient</title>
    <script>
      // Apply the stored appearance before first paint; web/theme.ts keeps it in sync afterwards.
      (function () {
        var theme = 'system';
        try {
          var stored = localStorage.getItem('salient.theme');
          if (stored === 'light' || stored === 'dark' || stored === 'system') theme = stored;
        } catch (e) {}
        var dark =
          theme === 'dark' ||
          (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var root = document.documentElement;
        root.classList.toggle('dark', dark);
        root.dataset.theme = theme;
        root.style.colorScheme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/web/main.tsx"></script>
  </body>
</html>
